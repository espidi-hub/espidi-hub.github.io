<script>
  // Published links to the old home page may already select one or both slots.
  const slots = new URLSearchParams(location.search);
  if (slots.has("play") || slots.has("page")) {
    try {
      // Carry only the referring origin across this internal redirect, never a repository URL.
      const origin = document.referrer ? new URL(document.referrer).origin : "";
      if (location.origin === "https://espidi-hub.github.io" && !navigator.globalPrivacyControl && navigator.doNotTrack !== "1") {
        sessionStorage.setItem("espidi-share-referrer", JSON.stringify({origin, time: Date.now()}));
      }
    } catch { /* Link routing must work without storage. */ }
    location.replace("composer.html" + location.search + location.hash);
  }
</script>
